<style>

  }
  html,body { background:var(--bg1); color:var(--text); font-family:Georgia,'Times New Roman',serif; min-height:100vh; overflow-x:hidden; }

  input,textarea,button { font-family:inherit; }

  header { background:rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.08); padding:calc(20px + env(safe-area-inset-top)) 20px 16px; position:sticky; top:0; z-index:10; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .eyebrow { font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
  .title { font-size:22px; font-weight:bold; letter-spacing:-0.5px; }
  .sub { font-size:12px; color:var(--muted2); margin-top:2px; }

  .datebar { display:flex; align-items:center; gap:10px; margin:20px 0; }
  .datebtn { background:rgba(255,255,255,0.08); border:none; color:var(--text); border-radius:8px; padding:8px 14px; font-size:16px; }
  .datebtn:disabled { color:#3a3a5a; }
  .datelabel { flex:1; text-align:center; }
  .datelabel .d1 { font-size:15px; font-weight:bold; }
  .datelabel .d2 { font-size:11px; color:var(--muted); }

  .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:24px 20px; margin-bottom:16px; }
  .card.sm { border-radius:14px; padding:14px 16px; background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.06); }
  .ringrow { display:flex; align-items:center; gap:20px; }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
  .remain { font-size:26px; font-weight:bold; }
  .defbox { background:rgba(255,255,255,0.05); border-radius:10px; padding:10px 12px; }
  .defbox .t { font-size:11px; color:var(--muted2); margin-bottom:2px; }
  .defbox .v { font-size:18px; font-weight:bold; }
  .defbox .s { font-size:10px; color:var(--dim); }

  .cap { font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .barbg { height:10px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; }
  .barfill { height:100%; border-radius:99px; transition:width .6s ease; }

  .entry { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .ico { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .ename { font-size:14px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .emeta { font-size:11px; color:var(--muted2); }
  .ekcal { font-size:16px; font-weight:bold; }
  .del { background:rgba(232,103,90,0.15); border:1px solid rgba(232,103,90,0.3); color:var(--red); border-radius:8px; width:28px; height:28px; font-size:14px; flex-shrink:0; }
  .empty { text-align:center; padding:30px 0; color:#4a5a6a; font-size:14px; }

  .histrow { margin-bottom:8px; }
  .histtop { display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; }

  .wbtn { background:linear-gradient(135deg,#7ec8e3,#5ba8c8); border:none; color:#fff; border-radius:10px; padding:11px 16px; font-size:13px; font-weight:bold; flex-shrink:0; }
  .winput { width:90px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:11px 12px; color:var(--text); font-size:15px; text-align:center; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; display:none; align-items:flex-end; }
  .overlay.open { display:flex; }
  .sheet { width:100%; max-width:480px; margin:0 auto; background:var(--bg2); border-radius:24px 24px 0 0; border:1px solid rgba(255,255,255,0.1); padding:24px 20px calc(40px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; }
  .grip { width:40px; height:4px; background:rgba(255,255,255,0.2); border-radius:99px; margin:0 auto 20px; }
  .sheet-title { font-size:16px; font-weight:bold; margin-bottom:16px; }

  .toggle { display:flex; background:rgba(255,255,255,0.06); border-radius:12px; padding:4px; margin-bottom:16px; }
  .toggle button { flex:1; padding:9px 0; border-radius:9px; border:none; background:transparent; color:var(--muted2); font-size:13px; }
  .toggle button.active { background:rgba(255,255,255,0.12); color:var(--text); font-weight:bold; }

  .fld { width:100%; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:12px 14px; color:var(--text); font-size:14px; }
  .lbl { font-size:11px; color:var(--muted); margin-bottom:5px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .col { flex:1; }

  .seclabel { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); padding:10px 14px 4px; }
  .suggest { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; margin:8px 0 12px; max-height:300px; overflow-y:auto; }
  .sg { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.05); }

  .sg:active { background:rgba(126,200,227,0.12); }
  .sg .n { flex:1; font-size:14px; }
  .sg .m { font-size:11px; color:var(--muted2); text-align:right; line-height:1.3; }
  .star { background:none; border:none; color:var(--amber); font-size:20px; width:30px; flex-shrink:0; }
  .badge { font-size:10px; opacity:0.7; }

  .calcbox { background:rgba(76,175,130,0.15); border:1px solid rgba(76,175,130,0.3); border-radius:10px; padding:8px 14px; margin-bottom:10px; font-size:13px; color:var(--green); text-align:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .chip { border-radius:20px; padding:5px 10px; font-size:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--muted); }
  .checkrow { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:10px 14px; background:rgba(232,168,74,0.08); border:1px solid rgba(232,168,74,0.2); border-radius:12px; font-size:13px; color:var(--amber); }
  .checkrow input { width:20px; height:20px; accent-color:var(--amber); }

  .addbtn { width:100%; border:none; border-radius:14px; padding:15px; color:#fff; font-size:15px; font-weight:bold; background:linear-gradient(135deg,#4caf82,#3d9e73); }

</div>

    </div>
    <input class="fld" id="fName" placeholder="Name des Lebensmittels" style="margin-bottom:10px">
    <div class="row">
      <div class="col"><div class="lbl">kcal / 100g</div><input class="fld" id="fKcal" type="number" inputmode="numeric" placeholder="z.B. 165"></div>

    </div>
    <div class="row">
      <div class="col"><div class="lbl" style="color:var(--amber)">🥩 Eiweiß / 100g</div><input class="fld" id="fEiweiss" type="number" inputmode="decimal" placeholder="z.B. 31" style="background:rgba(232,168,74,0.08);border-color:rgba(232,168,74,0.2)"></div>
      <div class="col"></div>
    </div>
    <div id="calc"></div>
    <label class="checkrow" id="customRow"><input type="checkbox" id="saveCustom"> 📌 Als eigenes Lebensmittel merken (erscheint künftig in der Suche)</label>
    <div class="lbl">Kategorie</div>
    <div class="chips" id="chips"></div>
    <button class="addbtn" id="saveBtn" disabled>Hinzufügen ✓</button>
  </div>
</div>

// ---------- State ----------
let state = { entries:{}, date:todayStr(), custom:[], favs:[], recent:[], weights:{} };
loadAll();

function todayStr(d){ return (d||new Date()).toISOString().split("T")[0]; }
function lsGet(k,def){ try { const r=localStorage.getItem(k); return r?JSON.parse(r):def; } catch(e){ return def; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function loadAll(){
  state.entries = lsGet("kt_entries", {});
  state.custom  = lsGet("kt_custom", []);
  state.favs    = lsGet("kt_favs", []);
  state.recent  = lsGet("kt_recent", []);
  state.weights = lsGet("kt_weights", {});
}

let selKat = "🍎 Obst";

const app = document.getElementById("app");
const subEl = document.getElementById("sub");

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function dayEntries(){ return state.entries[state.date] || []; }
function allFoods(){ return DB.concat(state.custom); }
function customSet(){ return new Set(state.custom.map(f=>f[0].toLowerCase())); }
function isFav(name){ return state.favs.some(f=>f[0].toLowerCase()===name.toLowerCase()); }
function latestWeight(){
  const ds = Object.keys(state.weights).sort();
  return ds.length ? state.weights[ds[ds.length-1]] : null;
}

function fmtDate(ds){
  if (ds === todayStr()) return "Heute";
  return new Date(ds+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
}

// ---------- Weight chart ----------
function weightChart(){
  const ds = Object.keys(state.weights).sort();
  if (ds.length < 2) return "";
  const vals = ds.map(d=>state.weights[d]);
  const min = Math.floor(Math.min(...vals)-1), max = Math.ceil(Math.max(...vals)+1);
  const W=300, H=110, padL=28, padR=8, padT=10, padB=18;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (ds.length===1?innerW/2:innerW*i/(ds.length-1));
  const y = v => padT + innerH*(1-(v-min)/(max-min || 1));
  let pts = ds.map((d,i)=>`${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`).join(" ");
  let dots = ds.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="2.6" fill="#7ec8e3"/>`).join("");
  const first = ds[0].slice(5), last = ds[ds.length-1].slice(5);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}" stroke="rgba(255,255,255,0.1)"/>
    <line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="rgba(255,255,255,0.1)"/>
    <text x="2" y="${padT+4}" fill="#6a7a8a" font-size="9" font-family="Georgia">${max}</text>
    <text x="2" y="${padT+innerH}" fill="#6a7a8a" font-size="9" font-family="Georgia">${min}</text>
    <polyline points="${pts}" fill="none" stroke="#7ec8e3" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${H-4}" fill="#6a7a8a" font-size="9" font-family="Georgia">${first}</text>
    <text x="${W-padR}" y="${H-4}" fill="#6a7a8a" font-size="9" font-family="Georgia" text-anchor="end">${last}</text>
  </svg>`;
}

function weightCard(){
  const lw = latestWeight();
  const ds = Object.keys(state.weights).sort();
  const cur = state.weights[state.date];
  let trend = "";
  if (ds.length >= 2){
    const diff = (state.weights[ds[ds.length-1]] - state.weights[ds[0]]);
    const c = diff<0?"var(--green)":diff>0?"var(--red)":"var(--muted2)";
    trend = `<span style="color:${c};font-size:13px">${diff>0?"+":""}${diff.toFixed(1)} kg seit Start</span>`;
  }
  return `<div class="card sm">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="cap">⚖️ Gewicht</div>
      <div>${lw!=null?`<b style="font-size:15px">${lw} kg</b> ${trend}`:`<span style="color:var(--muted2);font-size:12px">noch keine Daten</span>`}</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <input class="winput" id="wInput" type="number" inputmode="decimal" placeholder="kg" value="${cur!=null?cur:""}">
      <span style="font-size:12px;color:var(--muted2);flex:1">für ${state.date===todayStr()?"heute":state.date}</span>
      <button class="wbtn" id="wSave">${cur!=null?"Aktualisieren":"Eintragen"}</button>
    </div>
    ${weightChart()}
  </div>`;
}

// ---------- Main render ----------
function render(){
  const lw = latestWeight();
  subEl.textContent = `${lw!=null?lw:START_GEWICHT} kg · Ziel: ${ZIEL} kcal · ${EIWEISS_ZIEL}g Eiweiß`;

  const entries = dayEntries();
  const kcal = entries.reduce((s,e)=>s+e.kcal,0);
  const eiw = entries.reduce((s,e)=>s+(e.eiweiss||0),0);
  const remain = ZIEL - kcal;
  const pct = Math.min(kcal/ZIEL*100,100);
  const over = kcal > ZIEL;
  const defizit = TDEE - kcal;
  const ring = over ? "var(--red)" : pct>80 ? "var(--amber)" : "var(--green)";
  const C = 2*Math.PI*54, dash = pct/100*C;
  const today = todayStr();

  let html = "";
  html += `<div class="datebar">
    <button class="datebtn" id="prevDay">←</button>
    <div class="datelabel"><div class="d1">${fmtDate(state.date)}</div>${state.date!==today?`<div class="d2">${state.date}</div>`:""}</div>
    <button class="datebtn" id="nextDay" ${state.date===today?"disabled":""}>→</button>
  </div>`;

  html += `<div class="card"><div class="ringrow">
    <svg width="128" height="128" style="flex-shrink:0">
      <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
      <circle cx="64" cy="64" r="54" fill="none" stroke="${ring}" stroke-width="10" stroke-dasharray="${dash} ${C}" stroke-linecap="round" transform="rotate(-90 64 64)"/>
      <text x="64" y="58" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="bold" font-family="Georgia">${kcal}</text>
      <text x="64" y="74" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="Georgia">kcal</text>
      <text x="64" y="89" text-anchor="middle" fill="var(--muted2)" font-size="10" font-family="Georgia">von ${ZIEL}</text>
    </svg>
    <div style="flex:1">
      <div style="margin-bottom:12px"><div class="stat-label">Verbleibend</div>
        <div class="remain" style="color:${over?"var(--red)":"var(--green)"}">${over?"+"+Math.abs(remain):remain} kcal</div></div>
      <div class="defbox"><div class="t">Kaloriendefizit heute</div>
        <div class="v" style="color:${defizit>0?"var(--blue)":"var(--red)"}">${defizit>0?"−"+defizit:"+"+Math.abs(defizit)} kcal</div>
        <div class="s">Erhaltungsbedarf: ${TDEE} kcal</div></div>
    </div>
  </div></div>`;

  const pPct = Math.min(eiw/EIWEISS_ZIEL*100,100);
  html += `<div class="card sm">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="cap">🥩 Eiweiß</div>
      <div style="font-size:13px;font-weight:bold;color:${eiw>=EIWEISS_ZIEL?"var(--green)":"var(--amber)"}">${eiw}g / ${EIWEISS_ZIEL}g</div></div>
    <div class="barbg" style="height:8px"><div class="barfill" style="width:${pPct}%;background:${eiw>=EIWEISS_ZIEL?"var(--green)":"linear-gradient(90deg,#e8a84a,#e8675a)"}"></div></div>
    <div style="font-size:11px;color:var(--dim);margin-top:5px">${eiw>=EIWEISS_ZIEL?"✓ Eiweißziel erreicht!":"Noch "+(EIWEISS_ZIEL-eiw)+"g Eiweiß fehlen"}</div>
  </div>`;

  html += `<div class="card sm">
    <div class="cap" style="margin-bottom:10px;display:block">Tagesfortschritt</div>
    <div class="barbg"><div class="barfill" style="width:${pct}%;background:linear-gradient(90deg,#4caf82,${ring})"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted2)"><span>0</span><span>${Math.round(ZIEL/2)}</span><span>${ZIEL}</span></div>
  </div>`;

  html += weightCard();

  html += `<div style="margin-bottom:16px"><div class="cap" style="margin-bottom:12px;display:block">Heute gegessen</div>`;
  if (!entries.length) html += `<div class="empty">Noch keine Einträge 🍽️</div>`;
  else entries.forEach(e=>{
    const c = KAT[e.kategorie] || "#b8b8b8";
    html += `<div class="entry">
      <div class="ico" style="background:${c}22;border:1px solid ${c}44">${e.kategorie.split(" ")[0]}</div>
      <div style="flex:1;min-width:0"><div class="ename">${esc(e.name)}</div>
        <div class="emeta">${e.menge}g · ${e.kcalPro100} kcal/100g${e.eiweiss?" · 🥩 "+e.eiweiss+"g":""} · ${e.zeit}</div></div>
      <div style="text-align:right;flex-shrink:0"><div class="ekcal" style="color:${c}">${e.kcal}</div><div style="font-size:10px;color:var(--dim)">kcal</div></div>
      <button class="del" data-id="${e.id}">×</button></div>`;
  });
  html += `</div>`;

  const days = Object.keys(state.entries).sort().reverse().slice(0,7);
  if (days.length > 1){
    html += `<div class="card sm"><div class="cap" style="margin-bottom:12px;display:block">Verlauf</div>`;
    days.forEach(t=>{
      const k = (state.entries[t]||[]).reduce((s,e)=>s+e.kcal,0);
      const p = Math.min(k/ZIEL*100,120), ok = k<=ZIEL;
      const lbl = t===today?"Heute":new Date(t+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
      html += `<div class="histrow" data-date="${t}">
        <div class="histtop" style="color:${t===state.date?"var(--text)":"var(--muted2)"}"><span>${lbl}</span><span style="color:${ok?"var(--green)":"var(--red)"};font-weight:bold">${k} kcal</span></div>
        <div class="barbg" style="height:6px"><div class="barfill" style="width:${p}%;background:${ok?"var(--green)":"var(--red)"}"></div></div></div>`;
    });
    html += `</div>`;
  }

  app.innerHTML = html;

  document.getElementById("prevDay").onclick = ()=>{ const d=new Date(state.date); d.setDate(d.getDate()-1); state.date=todayStr(d); render(); };
  const nd = document.getElementById("nextDay");
  if (nd) nd.onclick = ()=>{ const d=new Date(state.date); d.setDate(d.getDate()+1); const ns=todayStr(d); if(ns<=todayStr()){state.date=ns; render();} };
  app.querySelectorAll(".del").forEach(b=> b.onclick = ()=>{ removeEntry(b.dataset.id); });
  app.querySelectorAll(".histrow").forEach(r=> r.onclick = ()=>{ state.date=r.dataset.date; render(); });

  const wSave = document.getElementById("wSave");
  if (wSave) wSave.onclick = ()=>{
    const v = parseFloat(document.getElementById("wInput").value.replace(",","."));
    if (v>0 && v<400){ state.weights[state.date]=Math.round(v*10)/10; lsSet("kt_weights",state.weights); render(); }
  };
}

function removeEntry(id){
  state.entries[state.date] = dayEntries().filter(e=>String(e.id)!==String(id));
  lsSet("kt_entries",state.entries); render();
}

// ---------- Sheet ----------
const overlay = document.getElementById("overlay");
const fName=document.getElementById("fName"), fKcal=document.getElementById("fKcal"),
      fMenge=document.getElementById("fMenge"), fEiweiss=document.getElementById("fEiweiss"),
      searchInput=document.getElementById("searchInput"), suggest=document.getElementById("suggest"),
      calc=document.getElementById("calc"), chipsEl=document.getElementById("chips"),
      saveBtn=document.getElementById("saveBtn"), saveCustom=document.getElementById("saveCustom");

document.getElementById("fab").onclick = openSheet;
overlay.onclick = (e)=>{ if(e.target===overlay) closeSheet(); };
function openSheet(){ overlay.classList.add("open"); switchTab("search"); resetForm(); }
function closeSheet(){ overlay.classList.remove("open"); }
function resetForm(){ fName.value=""; fKcal.value=""; fMenge.value="100"; fEiweiss.value=""; searchInput.value=""; selKat="🍎 Obst"; saveCustom.checked=false; renderSuggest(""); renderChips(); updateCalc(); validate(); }

function switchTab(which){
  const s = which==="search";
  document.getElementById("tabSearch").classList.toggle("active",s);
  document.getElementById("tabManual").classList.toggle("active",!s);
  document.getElementById("searchPane").style.display = s?"block":"none";
}
document.getElementById("tabSearch").onclick = ()=>switchTab("search");
document.getElementById("tabManual").onclick = ()=>switchTab("manual");

function renderChips(){
  chipsEl.innerHTML = Object.keys(KAT).map(k=>{ const c=KAT[k], on=k===selKat;
    return `<button class="chip" data-k="${k}" style="${on?`background:${c}33;border-color:${c};color:${c}`:""}">${k}</button>`; }).join("");
  chipsEl.querySelectorAll(".chip").forEach(b=> b.onclick=()=>{ selKat=b.dataset.k; renderChips(); });
}

function foodRowHtml(f, custSet){
  const c = KAT[f[3]]||"#b8b8b8";
  const isC = custSet.has(f[0].toLowerCase());
  const fav = isFav(f[0]);
  const d = `data-n="${esc(f[0])}" data-k="${f[1]}" data-p="${f[2]}" data-c="${esc(f[3])}"`;
  return `<div class="sg" ${d}>
    <div class="ico" style="width:30px;height:30px;font-size:15px;background:${c}22;border:1px solid ${c}44">${f[3].split(" ")[0]}</div>
    <div class="n">${esc(f[0])}${isC?' <span class="badge">📌</span>':''}</div>
    <div class="m">${f[1]} kcal<br>🥩 ${f[2]}g</div>
    <button class="star" ${d}>${fav?"★":"☆"}</button>
  </div>`;
}

function renderSuggest(q){
  q = (q||"").trim().toLowerCase();
  const cs = customSet();
  let html = "";
  if (!q){
    if (state.favs.length){ html += `<div class="seclabel">⭐ Favoriten</div>` + state.favs.map(f=>foodRowHtml(f,cs)).join(""); }
    if (state.recent.length){ html += `<div class="seclabel">🕒 Zuletzt gegessen</div>` + state.recent.slice(0,8).map(f=>foodRowHtml(f,cs)).join(""); }
    html += `<div class="seclabel">Vorschläge</div>` + allFoods().slice(0,8).map(f=>foodRowHtml(f,cs)).join("");
  } else {
    const list = allFoods().filter(f=>f[0].toLowerCase().includes(q)).slice(0,40);
    if (!list.length) html = `<div class="sg"><div class="n" style="color:var(--muted2)">Nichts gefunden – „Manuell" eintragen und ggf. als eigenes Lebensmittel merken</div></div>`;
    else html = list.map(f=>foodRowHtml(f,cs)).join("");
  }
  suggest.innerHTML = html;

  suggest.querySelectorAll(".sg").forEach(el=>{
    if (!el.dataset.n) return;
    el.onclick = (ev)=>{
      if (ev.target.classList.contains("star")) return;
      fName.value = el.dataset.n; fKcal.value = el.dataset.k; fEiweiss.value = el.dataset.p; selKat = el.dataset.c;
      if (!fMenge.value) fMenge.value = "100";
      renderChips(); updateCalc(); validate();
      searchInput.value=""; renderSuggest("");
      try { fMenge.focus(); } catch(e){}
    };
  });
  suggest.querySelectorAll(".star").forEach(b=>{
    b.onclick = (ev)=>{ ev.stopPropagation(); toggleFav([b.dataset.n, parseFloat(b.dataset.k), parseFloat(b.dataset.p), b.dataset.c]); renderSuggest(searchInput.value); };
  });
}

function toggleFav(f){
  const i = state.favs.findIndex(x=>x[0].toLowerCase()===f[0].toLowerCase());
  if (i>=0) state.favs.splice(i,1); else state.favs.unshift(f);
  lsSet("kt_favs", state.favs);
}

searchInput.oninput = ()=> renderSuggest(searchInput.value);

function updateCalc(){
  const k=parseFloat(fKcal.value), m=parseFloat(fMenge.value);
  if (k>=0 && m>0){
    const tot=Math.round(k*m/100), ei=fEiweiss.value?Math.round(parseFloat(fEiweiss.value)*m/100):0;
    calc.innerHTML = `<div class="calcbox">= ${tot} kcal gesamt${ei?` · 🥩 ${ei}g Eiweiß`:""}</div>`;
  } else calc.innerHTML="";
}
function validate(){ saveBtn.disabled = !(fName.value.trim() && fKcal.value!=="" && parseFloat(fMenge.value)>0); }
[fName,fKcal,fMenge,fEiweiss].forEach(el=> el.oninput = ()=>{ updateCalc(); validate(); });

saveBtn.onclick = ()=>{
  const k=parseFloat(fKcal.value), m=parseFloat(fMenge.value)||100, p=fEiweiss.value?parseFloat(fEiweiss.value):0;
  const name = fName.value.trim();
  const food = [name, k, p, selKat];

  const entry = { id:Date.now(), name, kcalPro100:k, menge:m, kcal:Math.round(k*m/100),
    eiweiss:p?Math.round(p*m/100):0, kategorie:selKat,
    zeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) };
  if(!state.entries[state.date]) state.entries[state.date]=[];
  state.entries[state.date].push(entry);
  lsSet("kt_entries", state.entries);

  // recent aktualisieren
  state.recent = state.recent.filter(f=>f[0].toLowerCase()!==name.toLowerCase());
  state.recent.unshift(food);
  state.recent = state.recent.slice(0,20);
  lsSet("kt_recent", state.recent);

  // eigenes Lebensmittel merken
  if (saveCustom.checked){
    const exists = allFoods().some(f=>f[0].toLowerCase()===name.toLowerCase());
    if (!exists){ state.custom.push(food); lsSet("kt_custom", state.custom); }
  }

  closeSheet(); render();
};

// install hint
(function(){
  const inStandalone = window.navigator.standalone===true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const dismissed = lsGet("kt_hint_dismissed",false);
  const hint = document.getElementById("installHint");
  if (hint && !inStandalone && !dismissed){
    hint.style.display="block";
    document.getElementById("hintClose").onclick = ()=>{ hint.style.display="none"; lsSet("kt_hint_dismissed",true); };
  }
})();

renderChips();
renderSuggest("");
render();
</script>
