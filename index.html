<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JB Fitness Pro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB Fitness">
<meta name="theme-color" content="#050507">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --bg:#050507;--bg2:#0d0f14;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.045);
 --line:rgba(255,255,255,.10);--text:#f8fafc;--muted:#8f9aaa;--green:#30d158;--blue:#64d2ff;
 --orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:
 radial-gradient(circle at 20% 0%,rgba(48,209,88,.18),transparent 30%),
 radial-gradient(circle at 80% 10%,rgba(100,210,255,.15),transparent 30%),
 linear-gradient(180deg,#050507,#0b1020 55%,#050507);color:var(--text);min-height:100vh;padding-bottom:92px}
button,input,select{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;padding:calc(18px + env(safe-area-inset-top)) 16px 12px;background:rgba(5,5,7,.72);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
.head{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#30d158,#64d2ff);display:grid;place-items:center;font-weight:900;color:#051107;box-shadow:0 10px 30px rgba(48,209,88,.25)}
.h-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
.h-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ghost{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 11px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(5,5,7,.78);backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tabbar{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 4px;font-size:11px}
.tab.active{background:var(--card);color:var(--text)}
.tab b{display:block;font-size:20px;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin:14px 0;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card.sm{border-radius:20px;padding:14px;background:var(--card2)}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}
.big{font-size:38px;font-weight:900;letter-spacing:-1.4px}
.mid{font-size:22px;font-weight:800}
.muted{color:var(--muted)}
.progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:10px}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--blue));transition:.4s}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px}
input,select{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:15px;padding:13px 14px;color:var(--text);font-size:16px;outline:0}
select option{background:#111;color:white}
.primary{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,var(--green),#1fbf75);color:#031006;padding:14px;font-weight:900;font-size:15px}
.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;font-weight:700}
.danger{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:var(--red)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:21px}
.item-main{flex:1;min-width:0}
.item-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.del{border:0;border-radius:11px;background:rgba(255,69,58,.14);color:var(--red);width:34px;height:34px;font-weight:900}
.fab{position:fixed;right:22px;bottom:calc(86px + env(safe-area-inset-bottom));width:62px;height:62px;border:0;border-radius:24px;background:linear-gradient(135deg,var(--green),var(--blue));color:#04100a;font-size:34px;font-weight:900;box-shadow:0 18px 45px rgba(48,209,88,.35);z-index:25}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:100}
.overlay.open{display:flex}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#10131a;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.grip{width:42px;height:5px;background:rgba(255,255,255,.22);border-radius:99px;margin:0 auto 18px}
.quick{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{width:100%;max-width:430px}
.logo-big{width:86px;height:86px;border-radius:27px;background:linear-gradient(135deg,#30d158,#64d2ff);display:grid;place-items:center;font-size:30px;font-weight:1000;color:#04100a;margin:0 auto 18px}
canvas{width:100%;height:160px;background:rgba(255,255,255,.025);border-radius:18px}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted);line-height:1.35}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const FOODS=[
["Shake Jonas",303,67,"🥤"],["Magerquark",67,12,"🥛"],["Skyr",63,11,"🥛"],["Naturjoghurt 1,5%",47,4.8,"🥛"],
["Hähnchenbrust",165,31,"🍗"],["Garnelen",99,24,"🍤"],["Lachs",208,20,"🐟"],["Ei gekocht",155,13,"🥚"],
["Reis gekocht",130,2.7,"🍚"],["Kartoffeln gekocht",77,2,"🥔"],["Haferflocken",372,13,"🥣"],["Banane",89,1.1,"🍌"],
["Apfel",54,.3,"🍎"],["Erdbeeren",32,.7,"🍓"],["Himbeeren",35,1.2,"🫐"],["Gurke",12,.6,"🥒"],
["Tomate",18,.9,"🍅"],["Brokkoli",34,2.8,"🥦"],["Salat gemischt",20,1.5,"🥗"],["Proteinriegel",350,33,"🍫"],
["Buttermilch",37,3.5,"🥛"],["Pizza Margherita",266,11,"🍕"],["Döner",215,15,"🥙"],["Maultaschen",180,9,"🥟"]
];
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let db=load("jbf_db",{users:{},active:null});
let page="home", date=today();

function calcTargets(p){
 const w=+p.weight||74,h=+p.height||173,a=+p.age||35,sex=p.sex||"m",act=+p.activity||1.45;
 const bmr=Math.round((10*w)+(6.25*h)-(5*a)+(sex==="m"?5:-161));
 const tdee=Math.round(bmr*act);
 const deficit=+(p.deficit||500);
 const calories=Math.max(1300,Math.round(tdee-deficit));
 const protein=Math.round(w*(+(p.proteinFactor||2.0)));
 return {bmr,tdee,calories,protein};
}
function user(){return db.users[db.active]}
function ensureUser(email,pass,name){
 if(!db.users[email]){
  db.users[email]={email,pass,name:name||email.split("@")[0],profile:{name:name||"Jonas",sex:"m",age:35,height:173,weight:74,goalWeight:70,activity:1.45,deficit:500,proteinFactor:2.0,manualCalories:"",manualProtein:""},entries:{},weights:{[today()]:74},custom:[],theme:"dark"};
 }
 db.active=email; save("jbf_db",db);
}
function targets(){
 const p=user().profile, t=calcTargets(p);
 return {calories:+p.manualCalories||t.calories,protein:+p.manualProtein||t.protein,tdee:t.tdee,bmr:t.bmr};
}
function dayEntries(){return user().entries[date]||[]}
function stats(){
 const e=dayEntries(), t=targets();
 const kcal=e.reduce((s,x)=>s+x.kcal,0), prot=e.reduce((s,x)=>s+x.protein,0);
 return {kcal,prot,rem:t.calories-kcal,prem:t.protein-prot,t};
}
function appShell(content){
 const u=user(), s=stats();
 return `<header><div class="head"><div class="logo">JB</div><div><div class="h-title">JB Fitness</div><div class="h-sub">${u.profile.name||u.name} · ${u.profile.weight||74} kg · Ziel ${s.t.calories} kcal / ${s.t.protein}g</div></div><button class="ghost" onclick="page='settings';render()">⚙️</button></div></header>
 <main class="wrap">${content}</main>
 <button class="fab" onclick="openFood()">+</button>
 <nav class="tabs"><div class="tabbar">
 <button class="tab ${page==='home'?'active':''}" onclick="page='home';render()"><b>🔥</b>Heute</button>
 <button class="tab ${page==='weight'?'active':''}" onclick="page='weight';render()"><b>⚖️</b>Gewicht</button>
 <button class="tab ${page==='stats'?'active':''}" onclick="page='stats';render()"><b>📈</b>Analyse</button>
 <button class="tab ${page==='settings'?'active':''}" onclick="page='settings';render()"><b>⚙️</b>Profil</button>
 </div></nav>${foodSheet()}`;
}
function loginScreen(){
 return `<div class="login"><div class="loginbox"><div class="logo-big">JB</div><h1 style="text-align:center;font-size:34px;margin-bottom:6px">JB Fitness</h1><p class="muted" style="text-align:center;margin-bottom:22px">Deine persönliche Fitness-App</p>
 <div class="card"><div class="label">Login lokal</div><div style="height:12px"></div>
 <input id="lemail" placeholder="E-Mail oder Name" value="jonas"><div style="height:10px"></div>
 <input id="lpass" placeholder="Passwort" type="password" value="1234"><div style="height:12px"></div>
 <button class="primary" onclick="doLogin()">Einloggen / Registrieren</button>
 <p class="note" style="margin-top:12px">Hinweis: Dieser Login ist lokal auf deinem Gerät gespeichert. Für echten Cloud-Login kann später Firebase ergänzt werden.</p>
 </div></div></div>`;
}
function doLogin(){
 const e=$("lemail").value.trim()||"jonas", p=$("lpass").value||"1234";
 ensureUser(e,p,e);
 render();
}
function home(){
 const s=stats(), pct=Math.min(100,s.kcal/s.t.calories*100), ppct=Math.min(100,s.prot/s.t.protein*100);
 const d=new Date(date+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"});
 return appShell(`<div class="card"><div class="label">${d}</div><div class="big">${s.rem>=0?s.rem:("+"+Math.abs(s.rem))}</div><div class="muted">kcal verbleibend</div><div class="progress"><div class="fill" style="width:${pct}%"></div></div>
 <div class="grid3" style="margin-top:14px"><div class="kpi"><div class="label">Gegessen</div><div class="mid">${s.kcal}</div></div><div class="kpi"><div class="label">Ziel</div><div class="mid">${s.t.calories}</div></div><div class="kpi"><div class="label">TDEE</div><div class="mid">${s.t.tdee}</div></div></div></div>
 <div class="card sm"><div class="label">Protein</div><div class="row" style="align-items:end;justify-content:space-between"><div class="mid">${s.prot}g / ${s.t.protein}g</div><div class="muted">${Math.max(0,s.prem)}g offen</div></div><div class="progress"><div class="fill" style="width:${ppct}%;background:linear-gradient(90deg,var(--orange),var(--green))"></div></div></div>
 <div class="quick"><button class="chip" onclick="quickFood('Shake Jonas',100)">🥤 Shake</button><button class="chip" onclick="quickFood('Magerquark',250)">🥛 Quark 250g</button><button class="chip" onclick="quickFood('Buttermilch',500)">🥛 Buttermilch</button><button class="chip" onclick="quickFood('Hähnchenbrust',200)">🍗 Hähnchen</button><button class="chip" onclick="quickFood('Proteinriegel',43)">🍫 Riegel</button></div>
 <div class="label" style="margin:18px 0 10px">Heute gegessen</div><div class="list">${dayEntries().length?dayEntries().map(e=>`<div class="item"><div class="ico">${e.icon||"🍽️"}</div><div class="item-main"><div class="item-title">${e.name}</div><div class="item-sub">${e.amount}g · ${e.protein}g Protein</div></div><b>${e.kcal}</b><button class="del" onclick="delEntry('${e.id}')">×</button></div>`).join(""):`<div class="card sm muted" style="text-align:center">Noch keine Einträge</div>`}</div>`);
}
function weight(){
 const u=user(), w=u.weights, keys=Object.keys(w).sort();
 setTimeout(drawWeight,50);
 const last=keys.length?w[keys[keys.length-1]]:u.profile.weight, goal=u.profile.goalWeight;
 return appShell(`<div class="card"><div class="label">Gewichtsverlauf</div><div class="row" style="align-items:end;justify-content:space-between"><div class="big">${last||"-"} kg</div><div class="muted">Ziel ${goal||"-"} kg</div></div><canvas id="weightChart" width="420" height="170"></canvas></div>
 <div class="card"><div class="label">Gewicht eintragen</div><div style="height:10px"></div><div class="row"><input id="wval" type="number" step="0.1" placeholder="kg" value="${last||""}"><button class="secondary" onclick="saveWeight()">Speichern</button></div></div>`);
}
function drawWeight(){
 const c=$("weightChart"); if(!c)return; const ctx=c.getContext("2d"), u=user(), keys=Object.keys(u.weights).sort(), vals=keys.map(k=>+u.weights[k]);
 ctx.clearRect(0,0,c.width,c.height); ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(20,145); ctx.lineTo(400,145); ctx.stroke();
 if(vals.length<2){ctx.fillStyle="#8f9aaa";ctx.fillText("Noch zu wenige Werte",150,85);return}
 const min=Math.min(...vals,+u.profile.goalWeight)-1,max=Math.max(...vals)+1;
 const x=i=>25+i*(370/(vals.length-1)), y=v=>145-(v-min)*(120/(max-min));
 ctx.strokeStyle="#30d158"; ctx.lineWidth=4; ctx.beginPath(); vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v))); ctx.stroke();
 ctx.fillStyle="#64d2ff"; vals.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),5,0,7);ctx.fill()});
 ctx.strokeStyle="rgba(255,159,10,.8)"; ctx.setLineDash([6,6]); ctx.beginPath(); const gy=y(+u.profile.goalWeight); ctx.moveTo(25,gy); ctx.lineTo(395,gy); ctx.stroke(); ctx.setLineDash([]);
}
function saveWeight(){ const v=parseFloat($("wval").value.replace(",",".")); if(v>20){user().weights[today()]=Math.round(v*10)/10; user().profile.weight=Math.round(v*10)/10; save("jbf_db",db); render();}}
function analysis(){
 const u=user(), days=Object.keys(u.entries).sort().slice(-14), t=targets();
 const avg=days.length?Math.round(days.reduce((s,d)=>s+(u.entries[d]||[]).reduce((a,e)=>a+e.kcal,0),0)/days.length):0;
 return appShell(`<div class="card"><div class="label">Analyse</div><div class="big">${avg}</div><div class="muted">Ø kcal der letzten ${days.length||0} Tage</div></div>
 <div class="grid2"><div class="kpi"><div class="label">Kalorienziel</div><div class="mid">${t.calories}</div></div><div class="kpi"><div class="label">Protein</div><div class="mid">${t.protein}g</div></div><div class="kpi"><div class="label">Grundumsatz</div><div class="mid">${t.bmr}</div></div><div class="kpi"><div class="label">Gesamtumsatz</div><div class="mid">${t.tdee}</div></div></div>
 <div class="card sm"><div class="label">Status</div><p class="muted" style="margin-top:8px;line-height:1.4">${avg&&avg<t.calories?"Du liegst aktuell unter deinem Ziel. Sehr gut.":"Trage ein paar Tage ein, dann bekommst du eine bessere Auswertung."}</p></div>`);
}
function settings(){
 const p=user().profile;
 return appShell(`<div class="card"><div class="label">Profil & Ziele</div><div style="height:12px"></div>
 <input id="pname" placeholder="Name" value="${p.name||""}"><div style="height:10px"></div>
 <div class="grid2"><input id="pagev" type="number" placeholder="Alter" value="${p.age||""}"><input id="pheight" type="number" placeholder="Größe cm" value="${p.height||""}"></div><div style="height:10px"></div>
 <div class="grid2"><input id="pweight" type="number" step=".1" placeholder="Gewicht kg" value="${p.weight||""}"><input id="pgoal" type="number" step=".1" placeholder="Zielgewicht" value="${p.goalWeight||""}"></div><div style="height:10px"></div>
 <select id="psex"><option value="m" ${p.sex==="m"?"selected":""}>Männlich</option><option value="w" ${p.sex==="w"?"selected":""}>Weiblich</option></select><div style="height:10px"></div>
 <select id="pact"><option value="1.25" ${p.activity==1.25?"selected":""}>Wenig aktiv</option><option value="1.45" ${p.activity==1.45?"selected":""}>Moderat aktiv</option><option value="1.65" ${p.activity==1.65?"selected":""}>Sportlich aktiv</option></select><div style="height:10px"></div>
 <div class="grid2"><input id="pcal" type="number" placeholder="Kalorien manuell" value="${p.manualCalories||""}"><input id="ppro" type="number" placeholder="Protein manuell" value="${p.manualProtein||""}"></div>
 <p class="note" style="margin-top:10px">Leer lassen = automatische Berechnung nach Gewicht, Größe, Alter und Aktivität.</p><div style="height:12px"></div><button class="primary" onclick="saveProfile()">Profil speichern</button></div>
 <div class="card"><div class="label">Datensicherung</div><div style="height:12px"></div><button class="secondary" onclick="exportData()">Backup exportieren</button><div style="height:10px"></div><input type="file" id="importFile" accept=".json" onchange="importData(event)"></div>
 <div class="card"><button class="secondary danger" onclick="logout()">Ausloggen</button></div>`);
}
function saveProfile(){const p=user().profile;p.name=$("pname").value;p.age=+$("pagev").value;p.height=+$("pheight").value;p.weight=+$("pweight").value;p.goalWeight=+$("pgoal").value;p.sex=$("psex").value;p.activity=+$("pact").value;p.manualCalories=$("pcal").value;p.manualProtein=$("ppro").value;save("jbf_db",db);render();}
function logout(){db.active=null;save("jbf_db",db);render()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jbfitness-backup.json";a.click();}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save("jbf_db",db);render()}catch{alert("Backup konnte nicht gelesen werden.")}};r.readAsText(f);}
function foodSheet(){
 return `<div class="overlay" id="foodOverlay" onclick="if(event.target.id==='foodOverlay')closeFood()"><div class="sheet"><div class="grip"></div><h2>Eintrag hinzufügen</h2><div style="height:12px"></div><input id="foodSearch" placeholder="Lebensmittel suchen" oninput="renderFoodList()"><div id="foodList" class="list" style="margin:12px 0"></div><div class="grid2"><input id="mname" placeholder="Name"><input id="mamount" type="number" placeholder="Gramm" value="100"></div><div style="height:10px"></div><div class="grid2"><input id="mkcal" type="number" placeholder="kcal / 100g"><input id="mprot" type="number" placeholder="Protein / 100g"></div><div style="height:12px"></div><button class="primary" onclick="addManual()">Hinzufügen</button></div></div>`;
}
function openFood(){ $("foodOverlay").classList.add("open"); renderFoodList();}
function closeFood(){ $("foodOverlay").classList.remove("open");}
function renderFoodList(){ const q=($("foodSearch")?.value||"").toLowerCase(); const list=FOODS.filter(f=>f[0].toLowerCase().includes(q)).slice(0,10); $("foodList").innerHTML=list.map(f=>`<button class="item" onclick="selectFood('${f[0].replaceAll("'","\\'")}')"><div class="ico">${f[3]}</div><div class="item-main" style="text-align:left"><div class="item-title">${f[0]}</div><div class="item-sub">${f[1]} kcal · ${f[2]}g Protein / 100g</div></div></button>`).join("");}
function selectFood(n){ const f=FOODS.find(x=>x[0]===n); $("mname").value=f[0]; $("mkcal").value=f[1]; $("mprot").value=f[2];}
function addManual(){const name=$("mname").value||"Eintrag",amount=+$("mamount").value||100,k=+$("mkcal").value||0,p=+$("mprot").value||0;addEntry({id:uid(),name,amount,kcal:Math.round(k*amount/100),protein:Math.round(p*amount/100),icon:"🍽️"});closeFood();}
function quickFood(n,amount){const f=FOODS.find(x=>x[0]===n); if(f)addEntry({id:uid(),name:f[0],amount,kcal:Math.round(f[1]*amount/100),protein:Math.round(f[2]*amount/100),icon:f[3]});}
function addEntry(e){ if(!user().entries[date])user().entries[date]=[]; user().entries[date].push(e); save("jbf_db",db); render();}
function delEntry(id){user().entries[date]=dayEntries().filter(e=>e.id!==id);save("jbf_db",db);render();}
function render(){ $("root").innerHTML=!db.active?loginScreen():(page==="home"?home():page==="weight"?weight():page==="stats"?analysis():settings());}
render();
</script>
</body>
</html>
