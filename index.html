<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JB Fitness Pro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB Fitness">

<link rel="manifest" href="manifest.json">

<style>
:root{
 --bg:#050507;--bg2:#0d0f14;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.045);
 --line:rgba(255,255,255,.10);--text:#f8fafc;--muted:#8f9aaa;--green:#30d158;--blue:#64d2ff;
 --orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:
 radial-gradient(circle at 20% 0%,rgba(48,209,88,.18),transparent 30%),
 radial-gradient(circle at 80% 10%,rgba(100,210,255,.15),transparent 30%),
 linear-gradient(180deg,#050507,#0b1020 55%,#050507);color:var(--text);min-height:100vh;padding-bottom:92px}
button,input,select{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;padding:calc(18px + env(safe-area-inset-top)) 16px 12px;background:rgba(5,5,7,.72);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
.head{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;overflow:hidden;display:grid;place-items:center;box-shadow:0 10px 30px rgba(48,209,88,.25)}
.logo img{width:100%;height:100%;object-fit:cover}
.h-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
.h-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ghost{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 11px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(5,5,7,.78);backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.tabbar{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 4px;font-size:11px}
.tab.active{background:var(--card);color:var(--text)}
.tab b{display:block;font-size:20px;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin:14px 0;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card.sm{border-radius:20px;padding:14px;background:var(--card2)}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}
.big{font-size:38px;font-weight:900;letter-spacing:-1.4px}
.mid{font-size:22px;font-weight:800}
.muted{color:var(--muted)}
.progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:10px}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--blue));transition:.4s}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px}
input,select{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:15px;padding:13px 14px;color:var(--text);font-size:16px;outline:0}
select option{background:#111;color:white}
.primary{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,var(--green),#1fbf75);color:#031006;padding:14px;font-weight:900;font-size:15px}
.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;font-weight:700}
.danger{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:var(--red)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:21px}
.item-main{flex:1;min-width:0}
.item-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.del{border:0;border-radius:11px;background:rgba(255,69,58,.14);color:var(--red);width:34px;height:34px;font-weight:900}
.fab{position:fixed;right:22px;bottom:calc(86px + env(safe-area-inset-bottom));width:62px;height:62px;border:0;border-radius:24px;background:linear-gradient(135deg,var(--green),var(--blue));color:#04100a;font-size:34px;font-weight:900;box-shadow:0 18px 45px rgba(48,209,88,.35);z-index:25}
.addtop{width:46px;height:46px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--blue));color:#04100a;font-size:28px;font-weight:900;line-height:1;box-shadow:0 8px 22px rgba(48,209,88,.35);display:grid;place-items:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:100}
.overlay.open{display:flex}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#10131a;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.grip{width:42px;height:5px;background:rgba(255,255,255,.22);border-radius:99px;margin:0 auto 6px}
.sheet-head{position:sticky;top:0;background:#10131a;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px;margin-bottom:4px;z-index:3}
.sheet-head h2{margin:0;font-size:19px}
.sheet-x{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;line-height:1;display:grid;place-items:center}
.quick{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px}
.chip.active{background:var(--green);color:#04100a;border-color:transparent;font-weight:800}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emoji{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:19px;line-height:1;display:grid;place-items:center}
.emoji.sel{border-color:var(--green);background:rgba(48,209,88,.16)}
.ob{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:14px;line-height:1.4}
.ob-i{font-size:22px;flex:0 0 28px;text-align:center}
#introOverlay{position:fixed;inset:0;background:#000;z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#introOverlay video{width:100%;height:100%;object-fit:cover}
#introSkip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));right:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);padding:10px 16px;border-radius:22px;font-size:15px;font-weight:700;backdrop-filter:blur(6px)}
#introSound{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);width:44px;height:44px;border-radius:22px;font-size:18px;backdrop-filter:blur(6px)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{width:100%;max-width:430px}
.logo-big{width:86px;height:86px;border-radius:27px;overflow:hidden;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 16px 40px rgba(48,209,88,.3)}
.logo-big img{width:100%;height:100%;object-fit:cover}
canvas{width:100%;height:160px;background:rgba(255,255,255,.025);border-radius:18px}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted);line-height:1.35}
.orline{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:13px}
.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.oauth{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.oauth.google{background:#fff;color:#1f1f1f}
.oauth.google span{font-weight:900;color:#4285F4}
.oauth.apple{background:#000;color:#fff;border:1px solid #333}
.oauth.apple span:before{content:"\F8FF";font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,24,32,.96);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

function cloudPull(silent){

    if(error){ if(!silent) alert(error.message); ensureAccountProfile(cloud.user); render(); return; }

}

// ===== Merge-Logik: lokale Daten + Cloud verschmelzen, ohne etwas zu verlieren =====
function mergeEntries(a,b){
  const out={}, dates=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  dates.forEach(d=>{
    const map=new Map();
    (b&&b[d]||[]).forEach(e=>map.set(e.id,e));   // Cloud zuerst
    (a&&a[d]||[]).forEach(e=>map.set(e.id,e));   // lokal überschreibt gleiche ID
    out[d]=[...map.values()];
  });
  return out;
}
function mergeCustom(a,b){
  const out=[...(a||[])], seen=new Set((a||[]).map(f=>(f[0]||"").toLowerCase()));
  (b||[]).forEach(f=>{ const k=(f[0]||"").toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(f); } });
  return out;
}
function mergeUser(a,b){
  if(!a) return b; if(!b) return a;
  const out=JSON.parse(JSON.stringify(a));        // lokal als Basis
  out.profile = a.profile || b.profile;           // Profil/Einstellungen: aktuelles Gerät gewinnt
  out.pass = (a.pass!==undefined && a.pass!=="") ? a.pass : (b.pass||"");
  out.name = a.name || b.name;
  out.theme = a.theme || b.theme;
  out.entries = mergeEntries(a.entries, b.entries);
  out.weights = Object.assign({}, b.weights||{}, a.weights||{}); // gleiches Datum: lokal gewinnt
  out.water   = Object.assign({}, b.water||{}, a.water||{});      // Wasser je Tag: lokal gewinnt
  out.custom  = mergeCustom(a.custom, b.custom);
  out.meals   = a.meals || b.meals;                              // gespeicherte Mahlzeiten
  out.favs    = a.favs  || b.favs;                               // Favoriten
  out.fast    = a.fast  || b.fast;                               // Fasten-Status
  out.fastLog = mergeFastLog(a.fastLog,b.fastLog);               // Fasten-Verlauf
  return out;
}
function mergeFastLog(a,b){ const map={}; [...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])].forEach(x=>{ if(x&&x.start) map[x.start]=x; }); return Object.values(map).sort((p,q)=>p.start-q.start); }
function mergeDB(local,cloud){
  if(!cloud||!cloud.users) return local;
  if(!local||!local.users) return cloud;
  const users={}, keys=new Set([...Object.keys(local.users),...Object.keys(cloud.users)]);
  keys.forEach(k=> users[k]=mergeUser(local.users[k], cloud.users[k]));
  const active = (local.active && users[local.active]) ? local.active
              : (cloud.active && users[cloud.active]) ? cloud.active
              : Object.keys(users)[0]||null;
  return { users, active, premium: !!(local.premium||cloud.premium) };
}

    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
  }catch(e){}
}

function calcTargets(p){
 const w=+p.weight||74,h=+p.height||173,a=+p.age||35,sex=p.sex||"m",act=+p.activity||1.45;
 const bf=+p.bodyfat;
 let bmr, method;
 if(bf>0 && bf<60){ const lean=w*(1-bf/100); bmr=Math.round(370+21.6*lean); method="Katch-McArdle"; }
 else { bmr=Math.round((10*w)+(6.25*h)-(5*a)+(sex==="m"?5:-161)); method="Mifflin-St-Jeor"; }
 const tdee=Math.round(bmr*act);
 const deficit=+(p.deficit||500);
 const calories=Math.max(1300,Math.round(tdee-deficit));
 const protein=Math.round(w*(+(p.proteinFactor||2.0)));
 return {bmr,tdee,calories,protein,method};
}

function shiftDay(delta){ const d=new Date(date+"T12:00"); d.setDate(d.getDate()+delta); const k=d.toISOString().slice(0,10); if(k>today()) return; date=k; render(); }
function goToday(){ date=today(); render(); }
let fastTick=null;
function fastState(){ const u=user(); if(!u.fast) u.fast={start:null,goalH:16}; return u.fast; }
function fastElapsedMs(){ const f=fastState(); return f.start?Date.now()-f.start:0; }
function fmtDur(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60; return `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function tsToHM(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function hmToTs(hm){ if(!hm) return Date.now(); const p=hm.split(":"); const d=new Date(); d.setHours(+p[0]||0,+p[1]||0,0,0); if(d.getTime()>Date.now()) d.setDate(d.getDate()-1); return d.getTime(); }
function startFast(){ const f=fastState(); const inp=$("fastStartInput"); f.start=(inp&&inp.value)?hmToTs(inp.value):Date.now(); save("jbf_db",db); render(); }
function stopFast(){ const f=fastState(); if(f.start) logFast(f.start,Date.now(),f.goalH); f.start=null; save("jbf_db",db); render(); }
function logFast(start,end,goalH){ const u=user(); if(!Array.isArray(u.fastLog)) u.fastLog=[]; const hours=Math.round((end-start)/3600000*10)/10; if(hours<0.5) return; u.fastLog.push({date:new Date(end).toISOString().slice(0,10),start,end,hours,goalH,reached:hours>=goalH}); if(u.fastLog.length>400) u.fastLog=u.fastLog.slice(-400); }
function fastStats(){ const u=user(); const log=Array.isArray(u.fastLog)?u.fastLog:[]; const n=log.length; const reached=log.filter(x=>x.reached).length;
 const avg=n?Math.round(log.reduce((s,x)=>s+x.hours,0)/n*10)/10:0; const longest=n?Math.round(Math.max(...log.map(x=>x.hours))*10)/10:0;
 const days=new Set(log.filter(x=>x.reached).map(x=>x.date)); const iso=x=>x.toISOString().slice(0,10); let streak=0,d=new Date(); if(!days.has(iso(d))) d.setDate(d.getDate()-1); while(days.has(iso(d))){ streak++; d.setDate(d.getDate()-1); }
 return {n,reached,avg,longest,streak,log}; }
function fmtH(h){ return String(Math.round(h*10)/10).replace(".",",")+" h"; }
function fastHistoryCard(){
 const fs=fastStats(); if(!fs.n) return `<div class="card"><div class="label">Dein Fasten-Verlauf</div><p class="muted" style="font-size:13px;margin-top:8px">Noch keine abgeschlossenen Fasten. Starte oben den Timer – sobald du „Fasten beenden" tippst, wird es hier protokolliert.</p></div>`;
 const rows=fs.log.slice(-7).reverse().map(x=>{ const dd=new Date(x.date+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}); return `<div class="item"><div class="ico">${x.reached?"✅":"⏱️"}</div><div class="item-main"><div class="item-title">${dd}</div><div class="item-sub">${fmtH(x.hours)} · Ziel ${x.goalH} h</div></div>${x.reached?'<b style="color:var(--green)">Ziel ✓</b>':'<span class="muted" style="font-size:12px">unter Ziel</span>'}</div>`; }).join("");
 return `<div class="card"><div class="label" style="margin-bottom:8px">Dein Fasten-Verlauf</div>
 <div class="grid2" style="margin-bottom:6px"><div class="kpi"><div class="label">Fasten gesamt</div><div class="mid">${fs.n}</div></div><div class="kpi"><div class="label">Ziel erreicht</div><div class="mid">${fs.reached}×</div></div><div class="kpi"><div class="label">Ø Dauer</div><div class="mid">${fmtH(fs.avg)}</div></div><div class="kpi"><div class="label">Streak</div><div class="mid">${fs.streak}</div><div class="muted" style="font-size:11px">Tage mit Ziel</div></div></div>
 <div class="label" style="margin:10px 0 6px">Letzte Fasten</div><div class="list">${rows}</div>
 <p class="muted" style="font-size:11px;margin-top:8px">Längstes Fasten: ${fmtH(fs.longest)}</p></div>`;
}
function setFastGoal(h){ fastState().goalH=+h||16; save("jbf_db",db); render(); }
function setFastStart(){ const inp=$("fastEditInput"); if(inp&&inp.value){ fastState().start=hmToTs(inp.value); save("jbf_db",db); render(); } }
function toggleFastInfo(){ const b=$("fastInfo"); if(b) b.style.display=(b.style.display==="none"||!b.style.display)?"block":"none"; }
function startFastTick(){ try{ clearInterval(fastTick); }catch(e){} const f=fastState(); if(!f.start) return;
 fastTick=setInterval(()=>{ const el=document.getElementById("fastElapsed"); if(!el){ clearInterval(fastTick); return; } el.textContent=fmtDur(fastElapsedMs()); const bar=document.getElementById("fastBar"); if(bar) bar.style.width=Math.min(100,fastElapsedMs()/(f.goalH*3600000)*100)+"%"; },1000); }
function fastInfoHtml(){ return `<div id="fastInfo" style="display:none;margin-top:10px;border-color:rgba(48,209,88,.3)" class="card sm"><div class="label" style="margin-bottom:6px;color:var(--green)">Was ist beim Fasten erlaubt?</div><p class="muted" style="font-size:13px;line-height:1.55">In der Fastenphase möglichst <b>kalorienfrei</b> bleiben. In Ordnung sind: <b>Wasser</b> (gern viel), <b>ungesüßter Tee</b> und <b>schwarzer Kaffee</b> ohne Milch & Zucker – diese brechen das Fasten praktisch nicht. Auch Mineralwasser oder Wasser mit einem Spritzer Zitrone passt.<br><br><b>Besser meiden:</b> alles mit Kalorien oder Süßstoffen – Milch/Latte, Säfte, Limonade (auch „Zero"), Snacks. Schon kleine Mengen Zucker, Eiweiß oder Fett beenden den Fastenzustand.<br><br>Trinke ausreichend – gerade beim Fasten ist das wichtig.</p></div>`; }
function fastCard(){
 const f=fastState();
 const infoBtn=`<button onclick="toggleFastInfo()" title="Was ist erlaubt?" style="background:var(--line);border:0;color:var(--text);min-width:28px;height:28px;border-radius:50%;font-weight:800;cursor:pointer">?</button>`;
 if(!f.start){
   const opt=[12,14,16,18].map(h=>`<button class="chip ${f.goalH===h?'active':''}" style="padding:4px 10px" onclick="setFastGoal(${h})">${h}:${24-h}</button>`).join("");
   return `<div class="card sm"><div class="row" style="justify-content:space-between;align-items:center"><div class="label">⏱️ Fasten-Timer</div>${infoBtn}</div>
   <div class="quick" style="margin:8px 0">${opt}</div>
   <p class="muted" style="font-size:12px;margin:0 0 8px">Intervallfasten ${f.goalH}:${24-f.goalH}. Du kannst die Startzeit anpassen, falls du schon früher angefangen hast.</p>
   <div class="row" style="gap:10px;align-items:center;margin-bottom:10px"><label class="muted" style="font-size:13px">Startzeit:</label><input id="fastStartInput" type="time" value="${nowHM()}" style="width:auto;flex:0 0 auto"></div>
   <button class="primary" onclick="startFast()">Fasten starten</button>

 }
 const goalMs=f.goalH*3600000, pct=Math.min(100,fastElapsedMs()/goalMs*100), reached=fastElapsedMs()>=goalMs;
 const sHM=tsToHM(f.start), eHM=tsToHM(f.start+goalMs);
 return `<div class="card sm" style="${reached?'border-color:rgba(48,209,88,.4)':''}"><div class="row" style="justify-content:space-between;align-items:center"><div class="label">⏱️ Fasten läuft (Ziel ${f.goalH} h)</div><div class="row" style="gap:8px;flex:0 0 auto;align-items:center">${reached?'<span style="color:var(--green);font-weight:700;font-size:12px">Ziel erreicht 🎉</span>':''}${infoBtn}</div></div>
 <div class="big" id="fastElapsed" style="margin:4px 0">${fmtDur(fastElapsedMs())}</div>
 <div class="progress"><div class="fill" id="fastBar" style="width:${pct}%;background:linear-gradient(90deg,#7b5cff,var(--green))"></div></div>

 <div class="row" style="gap:10px;align-items:center;margin-top:8px"><label class="muted" style="font-size:13px">Startzeit korrigieren:</label><input id="fastEditInput" type="time" value="${sHM}" style="width:auto;flex:0 0 auto"><button class="chip" onclick="setFastStart()">✓ übernehmen</button></div>

 <div class="card"><div class="label">Was kann es bringen?</div>

function drawWeight(){

 const keys=weightKeys(), vals=keys.map(k=>+u.weights[k]);
 ctx.clearRect(0,0,c.width,c.height); ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(20,145); ctx.lineTo(400,145); ctx.stroke();

 if(vals.length<2){ctx.fillStyle="#8f9aaa";ctx.fillText(keys.length?"Noch zu wenige Werte im Zeitraum":"Noch zu wenige Werte",130,85);return}
 const goal=+u.profile.goalWeight; const goalValid=goal>20;
 const min=Math.min(...vals,goalValid?goal:Infinity)-1, max=Math.max(...vals,goalValid?goal:-Infinity)+1;
 const x=i=>25+i*(370/(vals.length-1)), y=v=>145-(v-min)*(120/(max-min||1));
 if(goalValid){ ctx.strokeStyle="rgba(255,159,10,.8)"; ctx.setLineDash([6,6]); ctx.beginPath(); const gy=y(goal); ctx.moveTo(25,gy); ctx.lineTo(395,gy); ctx.stroke(); ctx.setLineDash([]); }

}

function mkPortion(a){ return {label:a[0],plural:a[1],grams:a[2],step:a[3]||1}; }
function portionFor(name){ const n=String(name||"").toLowerCase().trim(); if(PORTIONS[n]) return mkPortion(PORTIONS[n]);
 for(const key in PORTIONS){ if(n.startsWith(key+" ")||n.startsWith(key+",")||n.startsWith(key+"(")) return mkPortion(PORTIONS[key]); } return null; }
function fmtPieces(x){ const v=Math.round((+x)*100)/100; return (Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):String(v).replace(".",","); }
function fmtPortion(units,unit){ const u=+units; return fmtPieces(u)+" "+(Math.abs(u-1)<1e-9?unit.label:unit.plural); }
function currentGrams(){ const a=+($("mamount")?.value||0); return (curUnit&&unitMode==="piece")?a*curUnit.grams:a; }
function refreshUnitUI(){
 const amt=$("mamount"), tog=$("munitToggle"), hint=$("munitHint"); if(!amt)return;
 if(curUnit&&unitMode==="piece"){ amt.placeholder=curUnit.label; amt.step=curUnit.step||0.5; if(tog){tog.style.display="block";tog.textContent="g";} if(hint){hint.style.display="block";} }
 else { amt.placeholder="Gramm"; amt.step=1; if(tog){ tog.style.display=curUnit?"block":"none"; tog.textContent=curUnit?("in "+curUnit.label):""; } if(hint){hint.style.display="none";} }
}
function toggleUnit(){ if(!curUnit)return; const amt=$("mamount"); const v=+amt.value||0;
 if(unitMode==="piece"){ unitMode="gram"; amt.value=Math.round(v*curUnit.grams)||curUnit.grams; }
 else { unitMode="piece"; amt.value=(Math.round((v/curUnit.grams)*2)/2)||1; }
 refreshUnitUI(); updateMCalc(); }
function updateMCalc(){
 const grams=currentGrams(), k=+($("mkcal")?.value||0), p=+($("mprot")?.value||0), raw=+($("mamount")?.value||0);
 if(curUnit&&unitMode==="piece"){ const hint=$("munitHint"); if(hint&&hint.style.display!=="none") hint.textContent=`1 ${curUnit.label} ≈ ${curUnit.grams} g · gewählt: ${Math.round(grams)} g`; }
 const el=$("mcalc"); if(!el)return;
 if(grams>0 && (k||p)){ el.style.display="block"; const ut=(curUnit&&unitMode==="piece")?`${fmtPortion(raw,curUnit)} (${Math.round(grams)} g)`:`${Math.round(grams)} g`; el.innerHTML=`für <b>${ut}</b> = <b style="color:var(--green)">${Math.round(k*grams/100)}</b> kcal · <b style="color:var(--orange)">${Math.round(p*grams/100*10)/10}</b> g Protein`; }
 else { el.style.display="none"; el.innerHTML=""; }
}

 $("mprot").value=(e.p100!=null)?e.p100:(e.amount?Math.round(e.protein/e.amount*100*10)/10:e.protein);
 if(e.unit&&e.units){ curUnit={label:e.unit.label,plural:e.unit.plural,grams:e.unit.grams,step:0.5}; unitMode="piece"; $("mamount").value=e.units; }

 const t=$("foodTitle"); if(t)t.textContent="Eintrag bearbeiten";
 renderSwaps(e.name);
 updateMCalc();

function swapsFor(name){ const n=String(name||"").toLowerCase();
 if(/(vollkorn|dinkel|natur|zero|light|mager|zuckerfrei|ohne zucker|fettarm|1,5|0,1|0,2|puten|pute|hähnchen|hühner|geflügel|lachs|thunfisch|garnele|tofu|filet|kochschinken|skyr)/.test(n)) return null; // schon eine gute Wahl
 const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
 const hit=(key)=> key.length<=4 ? new RegExp("(^|[^a-zäöüß])"+esc(key)+"([^a-zäöüß]|$)").test(n) : n.includes(key);
 for(const [keys,alts] of SWAPS){ if(keys.some(hit)) return alts; } return null; }
let curSwaps=null;
function renderSwaps(name){
 const box=$("swapBox"); if(!box) return;
 const alts=swapsFor(name);
 if(!alts){ box.style.display="none"; box.innerHTML=""; curSwaps=null; return; }
 curSwaps={alts,cur:+($("mkcal")?.value||0)};
 box.style.display="block";
 box.innerHTML=`<button onclick="expandSwaps()" style="width:100%;text-align:left;background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.3);color:var(--green);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600">💡 Gesündere Alternative? <span style="color:var(--muted);font-weight:400">– tippen</span></button>`;
}
function expandSwaps(){
 const box=$("swapBox"); if(!box||!curSwaps) return; const cur=curSwaps.cur;
 const chips=curSwaps.alts.map(a=>{ const save=(cur&&a.k<cur-3)?` · <span style="color:var(--green)">−${cur-a.k} kcal/100g</span>`:""; const nm=String(a.n).replaceAll("'","\\'"); return `<button class="item" onclick="pickVals('${nm}',${a.k},${a.p})"><div class="ico">✨</div><div class="item-main" style="text-align:left"><div class="item-title">${a.n}</div><div class="item-sub">${a.k} kcal · ${a.p}g Protein / 100g${a.note?' · '+a.note:''}${save}</div></div></button>`; }).join("");
 box.innerHTML=`<div class="card sm" style="border-color:rgba(48,209,88,.35)"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label" style="color:var(--green)">💡 Vielleicht eine Alternative?</div><button onclick="collapseSwaps()" style="background:none;border:0;color:var(--muted);font-size:18px;line-height:1">×</button></div><div class="list">${chips}</div></div>`;
}

 const raw=+$("mamount").value||0;
 const piece=!!(curUnit&&unitMode==="piece");
 let grams=Math.round(piece?raw*curUnit.grams:raw); if(!grams) grams=piece?Math.round(curUnit.grams):100;
 const meal=$("mmeal")?$("mmeal").value:curMeal;
 const unit=piece?{label:curUnit.label,plural:curUnit.plural,grams:curUnit.grams}:null;

 }

 if(editId){

   if(i>=0) arr[i]={...arr[i],name,amount:grams,kcal,protein,k100:k,p100:p,meal,unit,units};

 }

function renderSavedMeals(){ const el=$("savedMeals"); if(!el)return; const m=Array.isArray(user().meals)?user().meals:[]; el.innerHTML=m.length?m.map((x,i)=>`<button class="chip" onclick="loadMeal(${i})">🍲 ${x.name}</button>`).join(""):""; }
function loadMeal(i){ const m=user().meals[i]; if(!m)return; mealB.items=m.items.map(x=>({...x})); const nm=$("mealName"); if(nm)nm.value=m.name; renderMealItems(); }
function mealSearchRender(){ const q=($("mealSearch")?.value||"").toLowerCase().trim(); const list=allFoods().filter(f=>f[0].toLowerCase().includes(q)).slice(0,10); const el=$("mealList"); if(el) el.innerHTML=list.map(f=>`<button class="item" onclick="mealPick('${f[0].replaceAll("'","\\'")}',${f[1]},${f[2]})"><div class="ico">${f[3]||"🍽️"}</div><div class="item-main" style="text-align:left"><div class="item-title">${f[0]}</div><div class="item-sub">${f[1]} kcal · ${f[2]}g/100g</div></div></button>`).join(""); }
function mealPick(n,k,p){ mealB.items.push({name:n,amount:100,k100:+k||0,p100:+p||0}); renderMealItems(); }
function mealAddManual(){ const n=$("ciName").value||"Zutat",a=+$("ciAmt").value||100,k=+$("ciK").value||0,p=+$("ciP").value||0; mealB.items.push({name:n,amount:a,k100:k,p100:p}); ["ciName","ciK","ciP"].forEach(id=>{const e=$(id);if(e)e.value="";}); const am=$("ciAmt");if(am)am.value="100"; renderMealItems(); }
function mealSetAmt(i,v){ if(mealB.items[i]){ mealB.items[i].amount=+v||0; renderMealItems(); } }
function mealRemove(i){ mealB.items.splice(i,1); renderMealItems(); }
function mealTotals(){ let k=0,p=0,g=0; mealB.items.forEach(it=>{k+=(+it.k100||0)*(+it.amount||0)/100;p+=(+it.p100||0)*(+it.amount||0)/100;g+=(+it.amount||0);}); return {k:Math.round(k),p:Math.round(p),g:Math.round(g)}; }
function renderMealItems(){
 const el=$("mealItems"); if(!el)return;
 el.innerHTML=mealB.items.length?mealB.items.map((it,i)=>`<div class="item"><div class="item-main" style="text-align:left"><div class="item-title">${it.name}</div><div class="item-sub">${Math.round((+it.k100||0)*(+it.amount||0)/100)} kcal · ${Math.round((+it.p100||0)*(+it.amount||0)/100)}g P</div></div><input type="number" value="${it.amount}" onchange="mealSetAmt(${i},this.value)" style="width:62px;text-align:center"><span class="muted" style="margin:0 6px">g</span><button class="del" onclick="mealRemove(${i})">×</button></div>`).join(""):`<div class="muted" style="font-size:12px;padding:6px">Noch keine Zutaten – oben suchen oder manuell hinzufügen.</div>`;
 const t=mealTotals(), tot=$("mealTotal"); if(tot) tot.innerHTML=`Gesamt: <b style="color:var(--green)">${t.k}</b> kcal · <b style="color:var(--orange)">${t.p}</b> g Protein · ${t.g} g`;
}
function saveMeal(){
 if(!mealB.items.length){ alert("Bitte mindestens eine Zutat hinzufügen."); return; }
 const name=$("mealName").value||"Mahlzeit", cat=$("mealCat").value, t=mealTotals();
 if($("mealSave")&&$("mealSave").checked){ if(!Array.isArray(user().meals))user().meals=[]; if(!user().meals.some(m=>m.name.toLowerCase()===name.toLowerCase())) user().meals.push({name,items:mealB.items.slice()}); }
 if(!user().entries[date]) user().entries[date]=[];
 user().entries[date].push({id:uid(),name,amount:t.g,kcal:t.k,protein:t.p,k100:t.g?Math.round(t.k/t.g*100):0,p100:t.g?Math.round(t.p/t.g*100*10)/10:0,icon:"🍲",meal:cat,components:mealB.items.slice()});
 save("jbf_db",db); closeMeal(); render();
}

// ===== Barcode-Scanner (Live + Foto-Fallback) + Open Food Facts =====
let scanner=null;
function scanFormats(){ return [Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128]; }
function startScan(){
 if(typeof Html5Qrcode==="undefined"){ alert("Scanner konnte nicht geladen werden. Bist du online?"); return; }
 const area=$("scanArea"); area.style.display="block"; area.innerHTML="";
 $("scanStop").style.display="block";
 scanner=new Html5Qrcode("scanArea");
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:160},formatsToSupport:scanFormats()},
   (txt)=>{ stopScan(); lookupBarcode(txt); },
   ()=>{}
 ).catch(e=>{ alert("Kamera nicht verfügbar: "+e+" — nutze stattdessen die Foto-Option."); area.style.display="none"; $("scanStop").style.display="none"; });
}
function stopScan(){
 const area=$("scanArea"), b=$("scanStop");
 if(scanner){ try{ scanner.stop().then(()=>{try{scanner.clear()}catch(e){}}).catch(()=>{}); }catch(e){} scanner=null; }
 if(area){ area.style.display="none"; }
 if(b){ b.style.display="none"; }
}
function scanPhoto(ev){
 const file=ev.target.files[0]; ev.target.value=""; if(!file)return;
 if(typeof Html5Qrcode==="undefined"){ alert("Scanner konnte nicht geladen werden. Bist du online?"); return; }
 const area=$("scanArea"); area.style.display="block"; area.innerHTML="";
 const tmp=new Html5Qrcode("scanArea");
 tmp.scanFile(file,true).then(txt=>{ try{tmp.clear()}catch(e){} area.style.display="none"; lookupBarcode(txt); })
   .catch(()=>{ try{tmp.clear()}catch(e){} area.style.display="none"; alert("Kein Barcode im Foto erkannt – bitte näher/schärfer fotografieren."); });
}
function lookupBarcode(code){
 toast("🔎 Suche "+code+" …");
 fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,brands,nutriments")
  .then(r=>r.json()).then(d=>{
    if(d.status===1 && d.product){
      const p=d.product, n=p.nutriments||{};
      const brand=p.brands?(" ("+p.brands.split(",")[0].trim()+")"):"";
      const name=((p.product_name||"").trim()+brand)||("Artikel "+code);
      $("mname").value=name;
      const kcal=n["energy-kcal_100g"], prot=n["proteins_100g"];
      if(kcal!=null)$("mkcal").value=Math.round(kcal);
      if(prot!=null)$("mprot").value=Math.round(prot*10)/10;
      if($("msave"))$("msave").checked=true;
      updateMCalc();
      toast("✅ "+name);
    } else {
      $("mname").value="Artikel "+code; if($("msave"))$("msave").checked=true;
      toast("⚠️ Nicht gefunden – Werte bitte selbst eintragen");
    }
  }).catch(()=>{ alert("Produktabruf fehlgeschlagen. Bist du online?"); });
}
function quickFood(n,amount){const f=FOODS.find(x=>x[0]===n); if(f)addEntry({id:uid(),name:f[0],amount,kcal:Math.round(f[1]*amount/100),protein:Math.round(f[2]*amount/100),k100:f[1],p100:f[2],icon:f[3]});}

// ===== Eigene Favoriten / Schnellauswahl =====
function escA(s){return String(s).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;");}
const FAV_EMOJIS=["🍽️","🥤","🥛","🍗","🐟","🥩","🍳","🥚","🧀","🍞","🍚","🍝","🥦","🥗","🍎","🍌","🥑","🥜","🍫","🍪","☕","🍰","💪","⭐","🔥"];
function setFavIcon(i,e){ readFavInputs(); const favs=ensureFavs(); if(favs[i]){ favs[i].icon=e; save("jbf_db",db); render(); } }
function ensureFavs(){
 const u=user();
 if(!Array.isArray(u.favs)){
  const seed=[["Shake Jonas",100],["Magerquark",250],["Buttermilch",500],["Hähnchenbrust",200],["Proteinriegel",43]];
  u.favs=seed.map(([n,a])=>{const f=FOODS.find(x=>x[0]===n)||[n,0,0,"🍽️"];return {name:f[0],kcal:f[1],protein:f[2],amount:a,icon:f[3]};});
  save("jbf_db",db);
 }
 return u.favs;
}
function quickFav(i){
 const f=ensureFavs()[i]; if(!f)return;
 const a=+f.amount||100;
 addEntry({id:uid(),name:f.name,amount:a,kcal:Math.round((+f.kcal||0)*a/100),protein:Math.round((+f.protein||0)*a/100),k100:+f.kcal||0,p100:+f.protein||0,icon:f.icon||"🍽️"});
}
function readFavInputs(){
 const u=user(); if(!Array.isArray(u.favs)) return;
 u.favs=u.favs.map((f,i)=>{
  const g=k=>$("fav"+i+k);
  if(!g("name")) return f;
  return { name:(g("name").value||"Favorit").trim(), icon:(g("icon").value||"🍽️").trim()||"🍽️",
           kcal:+g("kcal").value||0, protein:+g("prot").value||0, amount:+g("amt").value||100 };
 });
}
function addFav(){ readFavInputs(); ensureFavs().push({name:"Neuer Favorit",icon:"⭐",kcal:0,protein:0,amount:100}); save("jbf_db",db); render(); }
function removeFav(i){ readFavInputs(); ensureFavs().splice(i,1); save("jbf_db",db); render(); }
function saveFavs(){ readFavInputs(); save("jbf_db",db); render(); toast("⭐ Favoriten gespeichert"); }
function favEditorCard(){
 const favs=ensureFavs();
 const rows=favs.map((f,i)=>{
   const set=[...FAV_EMOJIS]; if(f.icon && !set.includes(f.icon)) set.unshift(f.icon);
   const opts=set.map(e=>`<option value="${e}" ${f.icon===e?"selected":""}>${e}</option>`).join("");
   return `<div class="card sm" style="margin-bottom:8px">
   <div class="row" style="gap:8px;align-items:center">
     <select id="fav${i}icon" style="width:62px;text-align:center;padding:10px 6px">${opts}</select>
     <input id="fav${i}name" value="${escA(f.name)}" placeholder="Name" style="flex:1">
     <button class="del" onclick="removeFav(${i})" title="Entfernen">×</button>
   </div>
   <div style="height:6px"></div>
   <div class="row" style="gap:8px">
     <div class="col"><div class="muted" style="font-size:11px;margin-bottom:4px">Kalorien / 100 g</div><input id="fav${i}kcal" type="number" inputmode="numeric" placeholder="kcal" value="${f.kcal||0}"></div>
     <div class="col"><div class="muted" style="font-size:11px;margin-bottom:4px">Eiweiß / 100 g</div><input id="fav${i}prot" type="number" inputmode="decimal" placeholder="g" value="${f.protein||0}"></div>
     <div class="col"><div class="muted" style="font-size:11px;margin-bottom:4px">Menge</div><input id="fav${i}amt" type="number" inputmode="numeric" placeholder="g" value="${f.amount||100}"></div>
   </div>
 </div>`;
 }).join("");
 return `<div class="card" id="favEditor"><div class="label">⭐ Meine Favoriten (Schnellauswahl)</div><p class="note" style="margin:8px 0 12px">Erscheinen als Schnell-Buttons auf „Heute". Werte pro 100 g, „Menge" = Standardportion. Mit „+ Favorit" beliebig viele hinzufügen.</p>
   ${rows||'<p class="muted">Noch keine Favoriten – mit „+ Favorit" anlegen.</p>'}
   <div class="row"><button class="secondary" style="flex:1" onclick="addFav()">+ Favorit</button><button class="primary" style="flex:1" onclick="saveFavs()">Speichern</button></div></div>`;
}
function addEntry(e){ if(!user().entries[date])user().entries[date]=[]; user().entries[date].push(e); save("jbf_db",db); render();}
function delEntry(id){user().entries[date]=dayEntries().filter(e=>e.id!==id);save("jbf_db",db);render();}
function profilesCard(){
 const entries=Object.entries(db.users||{});
 const multi=entries.length>1;
 const list=entries.map(([k,u])=>{
   const nm=u.profile?.name||u.name||k, ini=(nm[0]||"?").toUpperCase();
   const del=multi?`<button class="del" onclick="event.stopPropagation();deleteProfile('${k.replaceAll("'","\\'")}')" title="Profil löschen">🗑️</button>`:"";
   return `<div class="item" style="cursor:pointer" onclick="switchProfile('${k.replaceAll("'","\\'")}')"><div class="ico">${ini}</div><div class="item-main" style="text-align:left"><div class="item-title">${nm}</div><div class="item-sub">${u.profile?.weight||"–"} kg</div></div><div style="font-size:18px;color:${k===db.active?'var(--green)':'var(--muted)'}">${k===db.active?"●":"›"}</div>${del}</div>`;
 }).join("");
 return `<div class="card"><div class="label">Profile in diesem Konto</div><p class="note" style="margin:8px 0 12px">Aktives Profil ist grün markiert. Mehrere Personen pro Konto möglich. ${multi?"Mit 🗑️ löschst du ein Profil (mit Sicherheitsabfrage).":""}</p>
   <div class="list">${list}</div><div style="height:10px"></div>
   <div class="row"><input id="npname2" placeholder="Name neues Profil"><button class="secondary" onclick="addProfileInApp()">+ Profil</button></div></div>`;
}
function deleteProfile(k){
 const keys=Object.keys(db.users||{});
 if(keys.length<=1){ alert("Das einzige Profil kann nicht gelöscht werden."); return; }
 const u=db.users[k]; if(!u) return;
 const nm=u.profile?.name||u.name||k;
 const cnt=Object.values(u.entries||{}).reduce((s,a)=>s+a.length,0);
 if(!confirm("Profil „"+nm+"“ wirklich löschen?\nAlle Daten dieses Profils ("+cnt+" Einträge, Gewichte, Favoriten) werden endgültig entfernt. Das kann nicht rückgängig gemacht werden.")) return;
 delete db.users[k];
 if(db.active===k){ db.active=Object.keys(db.users)[0]; date=today(); page="settings"; }
 save("jbf_db",db); render();
}
function blankProfile(name){ return {name,sex:"m",age:"",height:"",weight:"",goalWeight:"",bodyfat:"",activity:1.375,deficit:500,proteinFactor:2.0,manualCalories:"",manualProtein:""}; }
function switchProfile(k){ if(db.users[k]){ db.active=k; date=today(); page="home"; save("jbf_db",db); render(); } }
function addProfileInApp(){
 const name=($("npname2").value||"").trim(); if(!name){ $("npname2").focus(); return; }
 const key=name.toLowerCase();
 if(db.users[key]){ alert("Ein Profil mit diesem Namen existiert bereits."); return; }
 db.users[key]={email:key,pass:"",name,profile:blankProfile(name),entries:{},weights:{},custom:[]};
 db.active=key; date=today(); page="settings"; save("jbf_db",db); render();
 setTimeout(()=>{var el=document.getElementById("favEditor");},30);
}
function isLoggedIn(){ return cloudConfigured() ? !!cloud.user : !!db.active; }
function ensureAccountProfile(u){
 if(!db.users) db.users={};
 if(db.active && db.users[db.active]) return;
 const keys=Object.keys(db.users);
 if(keys.length){ db.active=keys[0]; return; }
 const key=((u&&u.email)||"profil").toLowerCase();
 const meta=(u&&u.user_metadata)||{};
 const name=(meta.full_name||meta.name||((u&&u.email)||"Profil").split("@")[0]);
 db.users[key]={email:key,pass:"",name,profile:blankProfile(name),entries:{},weights:{},custom:[]};
 db.active=key;
}
function render(){ $("root").innerHTML=!isLoggedIn()?(cloudConfigured()&&authView==="register"?registerScreen():loginScreen()):(page==="home"?home():page==="weight"?weight():page==="stats"?analysis():page==="fasten"?fastenPage():settings());}
function showIntro(){
 try{
   if(window.__introShown) return; window.__introShown=true;
   let opens=(parseInt(localStorage.getItem("jbf_opens")||"0",10)||0)+1;
   localStorage.setItem("jbf_opens",String(opens));
   if(opens%5!==1) return;   // nur jedes 5. Öffnen (1., 6., 11., …)
   const ov=document.createElement("div"); ov.id="introOverlay";
   ov.innerHTML=`<video id="introVid" src="jbfitness-intro.mp4" autoplay muted playsinline webkit-playsinline></video>
     <button id="introSound" title="Ton">🔇</button>
     <button id="introSkip">Überspringen ›</button>`;
   document.body.appendChild(ov);
   const vid=document.getElementById("introVid");
   const close=()=>{ ov.style.opacity="0"; setTimeout(()=>{try{ov.remove()}catch(e){}},300); };
   document.getElementById("introSkip").onclick=close;
   document.getElementById("introSound").onclick=()=>{ vid.muted=!vid.muted; document.getElementById("introSound").textContent=vid.muted?"🔇":"🔊"; if(!vid.muted){try{vid.play()}catch(e){}} };
   vid.onended=close;
   vid.onerror=()=>{ try{ov.remove()}catch(e){} };   // Video noch nicht hochgeladen -> App nicht blockieren
   setTimeout(close,20000);                            // Sicherheits-Stop
 }catch(e){}
}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("service-worker.js").catch(()=>{}); }); }
document.addEventListener("click",function(e){ if(!("vibrate" in navigator)) return; const t=e.target.closest("button,[onclick],.item,.chip,.tab"); if(t){ try{ navigator.vibrate(10); }catch(_){} } },true);
initCloud();
render();
showIntro();
</script>
</body>
